[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "basic" # "strict" is usually too noisy for ROS 2 rclpy/msg types

[tool.ruff]
line-length = 120
src = [".", "orca_bridge", "orca_test"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["orca_bridge", "orca_bringup", "orca_gz", "orca_msgs", "orca_test"]

[tool.ruff.format]
# Could go either way, but 90% of the code is single, so settle on that
quote-style = "single"
