[tool.pyrefly]
# Use the Python environment in the containing ROS workspace
python-interpreter-path = "../../.venv/bin/python"
search_path = [
    "orca_bridge",
    "orca_bringup/scripts",
    "orca_test",
    "/opt/ros/jazzy/lib/python3.12/site-packages",
    "../../install/orca_msgs/lib/python3.12/site-packages",
    "../../install/orb_slam3_msgs/lib/python3.12/site-packages",
    "../../.venv/lib64/python3.12/site-packages/"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
# Could go either way, but 90% of the code is single, so settle on that
quote-style = "single"
