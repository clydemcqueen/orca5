%YAML:1.0
---

# NOTE: This file is kept for backwards compatibility and is identical to dwe_wet.yaml.
# Recommended: Use dwe_wet.yaml, dwe_dry.yaml, dwe_dry_1280_720.yaml, or dwe_dry_800_600.yaml instead.

File.version: "1.0"

#--------------------------------------------------------------------------------------------
# Camera Parameters
#--------------------------------------------------------------------------------------------

Camera.type: "PinHole"

# Camera calibration and distortion parameters (OpenCV) 
Camera1.fx: 1262.8514986708965
Camera1.fy: 1262.5093312469078
Camera1.cx: 929.6583073711543
Camera1.cy: 591.0263992455724

Camera1.k1: -0.3125250306454886
Camera1.k2: 0.1441666725273654
Camera1.p1: 0.0022009438999541614
Camera1.p2: -0.0003420131256401285
Camera1.k3: 0.0

Camera.width: 1920
Camera.height: 1080

Camera.newWidth: 1920
Camera.newHeight: 1080

# Camera frames per second 
Camera.fps: 10

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

#--------------------------------------------------------------------------------------------
# IMU Parameters (used in IMU_MONOCULAR mode; ignored in MONOCULAR mode)
#--------------------------------------------------------------------------------------------

# Transformation from camera optical frame (c1) to ArduPilot IMU body frame (b, FRD):
#   Derived from orca5_1.urdf camera_joint: xyz=(0.035, -0.08, -0.085), rpy=(0, pi/2, 0.3) in FLU,
#   composed with T_FLU_OPENCV (camera_link -> camera_sensor) and T_FRD_FLU.
IMU.T_b_c1: !!opencv-matrix
  rows: 4
  cols: 4
  dt: f
  data: [ 0.295520, -0.955336,  0.000000,  0.035000,
          0.955336,  0.295520,  0.000000,  0.080000,
          0.000000,  0.000000,  1.000000,  0.085000,
          0.000000,  0.000000,  0.000000,  1.000000 ]

# IMU noise parameters (continuous-time densities, Navigator ICM-20602)
IMU.NoiseGyro: 1.7e-4
IMU.NoiseAcc: 2.0e-3
IMU.GyroWalk: 2.0e-5
IMU.AccWalk: 3.0e-4

# IMU messages per second (/ap/imu/experimental/data rate)
# Must be a real number
IMU.Frequency: 153.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1000

# ORB Extractor: Scale factor between levels in the scale pyramid 	
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid	
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast			
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Tracking behavior
#--------------------------------------------------------------------------------------------

# How long until we create a new map, in seconds; must be a real number
System.timeRecentlyLost: 10000000.0

#--------------------------------------------------------------------------------------------
# Viewer Parameters (these are no longer used, but the code still requires them)
#---------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
